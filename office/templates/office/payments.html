{% extends 'office/base.html' %}
{% load status_tags %}
{% block title %}Payments{% endblock %}
{% block content %}
<!-- Filter / Search Bar -->
<div class="card stat-card mb-4 filter-bar">
    <div class="card-body">
        <form method="get" id="filterForm" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small text-muted">Search <span class="kbd-hint">Ctrl+K</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" name="q" id="searchInput" class="form-control" data-shortcut="search"
                           placeholder="Student, app ID..." value="{{ search_query }}">
                </div>
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted">Status</label>
                <select name="status" id="statusSelect" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="pending" {% if status_filter == 'pending' %}selected{% endif %}>Pending</option>
                    <option value="processing" {% if status_filter == 'processing' %}selected{% endif %}>Processing</option>
                    <option value="under_review" {% if status_filter == 'under_review' %}selected{% endif %}>Under Review</option>
                    <option value="completed" {% if status_filter == 'completed' %}selected{% endif %}>Completed</option>
                    <option value="failed" {% if status_filter == 'failed' %}selected{% endif %}>Failed</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted">From</label>
                <input type="date" name="date_from" id="dateFrom" class="form-control" value="{{ date_from }}">
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted">To</label>
                <input type="date" name="date_to" id="dateTo" class="form-control" value="{{ date_to }}">
            </div>
            <div class="col-md-3 d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Filter</button>
                <a href="{% url 'office:payment_list' %}" class="btn btn-outline-secondary">Clear</a>
                <a href="{% url 'office:export_payments_csv' %}?{{ request.GET.urlencode }}" class="btn btn-outline-success" data-action="export-csv" title="Export CSV (Ctrl+Shift+E)">
                    <i class="bi bi-download"></i> CSV
                </a>
            </div>
        </form>
    </div>
</div>

<!-- Payments Table -->
<div class="card stat-card">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-credit-card"></i> Payments</h5>
        <span class="badge bg-primary" id="resultCount">{{ payments|length }} record{{ payments|length|pluralize }}</span>
    </div>
    <div class="card-body" id="tableContainer">
        {% include 'office/_payment_table.html' %}
    </div>
</div>

<!-- Bulk Action Toolbar -->
<div class="bulk-toolbar d-none" id="bulkToolbar">
    <div class="bulk-count" id="bulkCount">0</div>
    <span class="text-white-50 small">selected</span>
    <div class="bulk-actions">
        <button class="btn btn-success btn-sm" onclick="doBulk('approve')" title="Approve selected payments">
            <i class="bi bi-check-circle"></i> Approve
        </button>
        <button class="btn btn-danger btn-sm" onclick="doBulk('reject')" title="Reject selected payments">
            <i class="bi bi-x-circle"></i> Reject
        </button>
    </div>
    <button class="btn btn-deselect btn-sm" onclick="window.DFS._bulkPaymentManager.clearSelection()">
        <i class="bi bi-x-lg"></i> Deselect
    </button>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    DFS.initLiveSearch({
        searchInput: '#searchInput',
        statusSelect: '#statusSelect',
        dateFrom: '#dateFrom',
        dateTo: '#dateTo',
        targetContainer: '#tableContainer',
        url: '{% url "office:payment_list" %}',
        onAfterLoad: function() {
            if (DFS._bulkPaymentManager) DFS._bulkPaymentManager.rebind();
        }
    });

    DFS._bulkPaymentManager = new DFS.BulkActionManager({
        tableSelector: '#paymentTable',
        checkboxName: 'payment_ids',
        toolbarSelector: '#bulkToolbar',
        countSelector: '#bulkCount',
        selectAllSelector: '#selectAllPayments',
        actionUrl: '{% url "office:bulk_payment_action" %}'
    });
});

function doBulk(action) {
    DFS._bulkPaymentManager.executeAction(action).then(function() {
        document.querySelector('#searchInput').dispatchEvent(new Event('input'));
    });
}
</script>
{% endblock %}
